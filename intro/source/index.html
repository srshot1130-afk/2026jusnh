<!doctype html>
<html lang="ko" data-resolution="landscape">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<script src="vendor/gsap.min.js"></script>
<style>
@font-face{font-family:"Pretendard";src:url("fonts/Pretendard-Regular.woff2") format("woff2");font-weight:400}
@font-face{font-family:"Pretendard";src:url("fonts/Pretendard-Medium.woff2") format("woff2");font-weight:500}
@font-face{font-family:"Pretendard";src:url("fonts/Pretendard-SemiBold.woff2") format("woff2");font-weight:600}
@font-face{font-family:"Pretendard";src:url("fonts/Pretendard-Bold.woff2") format("woff2");font-weight:700}
@font-face{font-family:"Pretendard";src:url("fonts/Pretendard-ExtraBold.woff2") format("woff2");font-weight:800}
:root{
  /* 송년의 밤 초대 페이지와 같은 색 */
  --bg:#0e100f; --cream:#fffce1; --sub:#9a9a8c;
  --yellow:#fcc800; --green:#0ae448; --lgreen:#abff84;
  --orange:#ff8709; --pink:#fec5fb; --lilac:#9d95ff; --blue:#00bae2;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{margin:0;overflow:hidden;background:var(--bg)}
#root{width:100%;height:100%;position:relative;overflow:hidden;font-family:"Pretendard",sans-serif;color:var(--cream);word-break:keep-all;background:var(--bg)}
.scene{position:absolute;inset:0;overflow:hidden}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.mask{display:block;overflow:hidden;padding:0 0.06em}
.mask > span{display:inline-block}
.grad{background:linear-gradient(114deg,var(--green) 20%,var(--lgreen) 66%);-webkit-background-clip:text;background-clip:text;color:transparent}

/* 배경 */
#bg .glow{position:absolute;width:90vmin;height:90vmin;border-radius:50%;filter:blur(12vmin);opacity:0}
#glow1{left:-20vmin;top:-30vmin;background:radial-gradient(circle,rgba(10,228,72,.45),transparent 65%)}
#glow2{right:-25vmin;bottom:-35vmin;background:radial-gradient(circle,rgba(252,200,0,.35),transparent 65%)}
#bg .line{position:absolute;left:0;height:1px;width:100%;background:rgba(255,252,225,.08);transform-origin:left center}

/* 장면 1: 심볼 */
#s1 .ring{position:absolute;left:50%;top:50%;border-radius:50%;border:0.35vmin solid var(--yellow);transform:translate(-50%,-50%) scale(0);opacity:0}
#s1-ring1{width:46vmin;height:46vmin}
#s1-ring2{width:70vmin;height:70vmin;border-color:rgba(255,252,225,.35) !important}
#s1-ring3{width:100vmin;height:100vmin;border-color:rgba(10,228,72,.35) !important}
#s1-symbol{position:absolute;left:50%;top:50%;width:24vmin;margin:-15vmin 0 0 -12vmin}
#s1-dots{position:absolute;left:50%;top:50%;width:0;height:0}
#s1-dots i{position:absolute;width:1.8vmin;height:1.8vmin;margin:-0.9vmin;border-radius:50%}

/* 장면 2: 열두 달 카드 */
#s2-stage{position:absolute;left:50%;top:50%;width:0;height:0;transform:rotate(-7deg)}
.row{position:absolute;left:0;display:flex;gap:3vmin}
#s2-row1{top:-41vmin}
#s2-row2{top:3vmin}
.card{position:relative;flex:none;width:30vmin;height:38vmin;border-radius:2.4vmin;overflow:hidden;padding:2.6vmin;display:flex;flex-direction:column;justify-content:space-between;color:var(--bg)}
.card::after{content:"";position:absolute;inset:1.4vmin;border:0.25vmin solid rgba(14,16,15,.18);border-radius:1.4vmin}
.card b{font-size:11vmin;font-weight:800;letter-spacing:-0.04em;line-height:.9}
.card small{font-size:3vmin;font-weight:700;letter-spacing:.12em}
.c1{background:var(--green)}.c2{background:var(--lgreen)}.c3{background:var(--yellow)}
.c4{background:var(--orange)}.c5{background:var(--pink)}.c6{background:var(--lilac)}
.c7{background:var(--blue)}.c8{background:var(--cream)}
#s2-shade{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(14,16,15,.92) 0%,rgba(14,16,15,.75) 45%,rgba(14,16,15,.35) 100%);opacity:0}
#s2-text{position:absolute;inset:0;gap:2.6vmin}
#s2-eyebrow{font-size:3.6vmin;font-weight:600;letter-spacing:.3em;color:var(--yellow)}
#s2-title{font-size:10vmin;font-weight:800;letter-spacing:-0.035em;line-height:1.15}

/* 장면 3: 2026 */
#s3{gap:1vmin}
#s3-year{display:flex;font-size:40vmin;font-weight:800;letter-spacing:-0.05em;line-height:1}
#s3-year .d{display:block;overflow:hidden;height:1em;padding:0 0.01em}
#s3-year .d > span{display:block}
#s3-year .g{display:block;background:linear-gradient(114deg,var(--green) 10%,var(--lgreen) 90%);-webkit-background-clip:text;background-clip:text;color:transparent}
#s3-roll{display:flex !important;flex-direction:column}
#s3-sub{font-size:7vmin;font-weight:700;letter-spacing:-0.02em}

/* 장면 4: 타이틀 */
#s4{gap:0}
#s4-mark{width:52vmin;margin-bottom:6vmin}
#s4-mark img{width:100%;display:block}
#s4-title{font-size:12vmin;font-weight:800;letter-spacing:-0.04em;line-height:1.15}
#s4-bar{width:16vmin;height:0.9vmin;border-radius:1vmin;margin:4.5vmin 0 4vmin;background:linear-gradient(90deg,var(--green),var(--lgreen))}
#s4-sub{font-size:4.6vmin;font-weight:600;color:var(--cream)}
#s4-tag{margin-top:2vmin;font-size:3vmin;font-weight:500;color:var(--sub);letter-spacing:.04em}
#s4-frame{position:absolute;inset:5vmin;border:0.25vmin solid rgba(255,252,225,.18);border-radius:3vmin}
.corner{position:absolute;font-size:2.4vmin;font-weight:600;letter-spacing:.2em;color:var(--sub)}
#s4-c1{left:9vmin;top:8.5vmin}#s4-c2{right:9vmin;top:8.5vmin}
#s4-c3{left:9vmin;bottom:8.5vmin}#s4-c4{right:9vmin;bottom:8.5vmin}

#fade{position:absolute;inset:0;background:#000;opacity:0}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="14" data-width="1920" data-height="1080">

  <!-- 배경 (전체) -->
  <div id="bg" class="clip scene" data-start="0" data-duration="14" data-track-index="0">
    <div id="glow1" class="glow"></div>
    <div id="glow2" class="glow"></div>
    <div class="line" style="top:22%"></div>
    <div class="line" style="top:50%"></div>
    <div class="line" style="top:78%"></div>
  </div>

  <!-- 장면 1: 농협 심볼 (0~3.4초) -->
  <div id="s1" class="clip scene" data-start="0" data-duration="3.4" data-track-index="1">
    <div id="s1-ring3" class="ring"></div>
    <div id="s1-ring2" class="ring"></div>
    <div id="s1-ring1" class="ring"></div>
    <div id="s1-dots">
      <i style="background:var(--green)"></i><i style="background:var(--orange)"></i>
      <i style="background:var(--lilac)"></i><i style="background:var(--pink)"></i>
      <i style="background:var(--blue)"></i><i style="background:var(--lgreen)"></i>
    </div>
    <img id="s1-symbol" src="assets/symbol.png" alt="" />
  </div>

  <!-- 장면 2: 열두 달 (3.1~7.3초) -->
  <div id="s2" class="clip scene" data-start="3.1" data-duration="4.2" data-track-index="2">
    <div id="s2-stage">
      <div id="s2-row1" class="row">
        <div class="card c1"><small>JAN</small><b>01</b></div>
        <div class="card c3"><small>FEB</small><b>02</b></div>
        <div class="card c5"><small>MAR</small><b>03</b></div>
        <div class="card c2"><small>APR</small><b>04</b></div>
        <div class="card c7"><small>MAY</small><b>05</b></div>
        <div class="card c4"><small>JUN</small><b>06</b></div>
        <div class="card c8"><small>DEC</small><b>12</b></div>
        <div class="card c6"><small>NOV</small><b>11</b></div>
        <div class="card c1"><small>JAN</small><b>01</b></div>
      </div>
      <div id="s2-row2" class="row">
        <div class="card c6"><small>JUL</small><b>07</b></div>
        <div class="card c3"><small>AUG</small><b>08</b></div>
        <div class="card c1"><small>SEP</small><b>09</b></div>
        <div class="card c4"><small>OCT</small><b>10</b></div>
        <div class="card c5"><small>NOV</small><b>11</b></div>
        <div class="card c8"><small>DEC</small><b>12</b></div>
        <div class="card c2"><small>JAN</small><b>01</b></div>
        <div class="card c3"><small>FEB</small><b>02</b></div>
        <div class="card c7"><small>MAR</small><b>03</b></div>
      </div>
    </div>
    <div id="s2-shade"></div>
    <div id="s2-text" class="center">
      <div class="mask"><span id="s2-eyebrow">JUNG-ULSAN NONGHYUP</span></div>
      <div class="mask"><span id="s2-title">우리가 함께한 열두 달</span></div>
    </div>
  </div>

  <!-- 장면 3: 2026 (7.0~10.4초) -->
  <div id="s3" class="clip scene center" data-start="7.0" data-duration="3.4" data-track-index="1">
    <div id="s3-year">
      <span class="d"><span class="g">2</span></span>
      <span class="d"><span class="g">0</span></span>
      <span class="d"><span class="g">2</span></span>
      <span class="d"><span id="s3-roll"><span class="g">5</span><span class="g">6</span></span></span>
    </div>
    <div class="mask"><span id="s3-sub">함께라서 빛났던 순간들</span></div>
  </div>

  <!-- 장면 4: 타이틀 (10.1~14초) -->
  <div id="s4" class="clip scene center" data-start="10.1" data-duration="3.9" data-track-index="2">
    <div id="s4-frame"></div>
    <div id="s4-c1" class="corner">2026</div>
    <div id="s4-c2" class="corner">YEAR IN REVIEW</div>
    <div id="s4-c3" class="corner">VISION 2030</div>
    <div id="s4-c4" class="corner">송년의 밤</div>
    <div id="s4-mark"><img src="assets/wordmark.png" alt="중울산농협" /></div>
    <div class="mask"><span id="s4-title">2026, <span class="grad">함께한 순간들</span></span></div>
    <div id="s4-bar"></div>
    <div class="mask"><span id="s4-sub">중울산농협 행사 스케치</span></div>
    <div class="mask"><span id="s4-tag">농업인과 함께! 지역사회와 함께!</span></div>
  </div>

  <!-- 사진 본편으로 넘어가는 암전 -->
  <div id="fade" class="clip scene" data-start="13.2" data-duration="0.8" data-track-index="3"></div>

</div>
<script>
// paused 타임라인 1개, 루트 기준 절대초
const tl = gsap.timeline({ paused: true });

// ── 배경 ──────────────────────────────────────
tl.to("#glow1", {opacity:1, x:"20vmin", y:"10vmin", duration:6, ease:"sine.inOut"}, 0)
  .to("#glow2", {opacity:1, x:"-15vmin", y:"-10vmin", duration:6, ease:"sine.inOut"}, 0.5)
  .to("#glow1", {x:"60vmin", y:"30vmin", duration:7, ease:"sine.inOut"}, 6)
  .to("#glow2", {x:"-50vmin", y:"-25vmin", duration:7, ease:"sine.inOut"}, 6.5)
  .fromTo("#bg .line", {scaleX:0}, {scaleX:1, duration:1.2, ease:"power3.inOut", stagger:0.12}, 0.1);

// ── 장면 1: 심볼 ──────────────────────────────
tl.fromTo("#s1-symbol", {scale:0, rotation:-25, opacity:0},
          {scale:1, rotation:0, opacity:1, duration:1.0, ease:"back.out(1.8)"}, 0.35)
  .to("#s1-ring1", {scale:1, opacity:1, duration:0.9, ease:"expo.out"}, 0.55)
  .to("#s1-ring2", {scale:1, opacity:1, duration:1.1, ease:"expo.out"}, 0.7)
  .to("#s1-ring3", {scale:1, opacity:1, duration:1.3, ease:"expo.out"}, 0.85);

// 컬러 점이 궤도를 돌며 퍼짐
const dots = gsap.utils.toArray("#s1-dots i");
dots.forEach((d, i) => {
  const a0 = i * 60, r = 35 * 10.8; // 35vmin
  const o = {a:a0, r:0};
  tl.fromTo(d, {opacity:0}, {opacity:1, duration:0.3}, 0.9 + i*0.05)
    .to(o, {a:a0 + 120, r:r, duration:2.0, ease:"power2.out",
      onUpdate:()=>{ const rad=o.a*Math.PI/180; gsap.set(d,{x:Math.cos(rad)*o.r, y:Math.sin(rad)*o.r}); }}, 0.9 + i*0.05);
});

// 퇴장: 심볼이 확대되며 다음 장면으로
tl.to("#s1-symbol", {scale:9, opacity:0, duration:0.6, ease:"power3.in"}, 2.8)
  .to(["#s1-ring1","#s1-ring2","#s1-ring3"], {scale:2.2, opacity:0, duration:0.6, ease:"power3.in", stagger:0.04}, 2.75)
  .to("#s1-dots", {opacity:0, duration:0.4}, 2.8);

// ── 장면 2: 열두 달 카드 ──────────────────────
const ROW = document.getElementById("s2-row1").scrollWidth;
tl.fromTo("#s2-stage", {scale:1.35, opacity:0}, {scale:1, opacity:1, duration:1.0, ease:"power3.out"}, 3.1)
  .fromTo("#s2-row1", {x:-ROW/2 + 260}, {x:-ROW/2 - 260, duration:4.2, ease:"none"}, 3.1)
  .fromTo("#s2-row2", {x:-ROW/2 - 260}, {x:-ROW/2 + 260, duration:4.2, ease:"none"}, 3.1)
  .fromTo(".card", {rotationY:90, opacity:0}, {rotationY:0, opacity:1, duration:0.6, ease:"power2.out", stagger:0.025}, 3.15)
  .to("#s2-shade", {opacity:1, duration:0.6, ease:"power2.out"}, 4.6)
  .fromTo("#s2-eyebrow", {yPercent:110}, {yPercent:0, duration:0.6, ease:"power3.out"}, 4.8)
  .fromTo("#s2-title", {yPercent:110}, {yPercent:0, duration:0.7, ease:"power3.out"}, 4.95)
  .to("#s2-text", {opacity:0, y:"-3vmin", duration:0.4, ease:"power2.in"}, 6.75)
  .to("#s2-stage", {scale:0.85, opacity:0, duration:0.5, ease:"power2.in"}, 6.75);

// ── 장면 3: 2025 → 2026 ──────────────────────
tl.fromTo("#s3-year .d > span", {yPercent:110}, {yPercent:0, duration:0.7, ease:"power4.out", stagger:0.08}, 7.05)
  .to("#s3-roll", {yPercent:-50, duration:0.7, ease:"power4.inOut"}, 8.0)
  .fromTo("#s3-year", {scale:0.96}, {scale:1.04, duration:3.0, ease:"none"}, 7.05)
  .fromTo("#s3-sub", {yPercent:110}, {yPercent:0, duration:0.6, ease:"power3.out"}, 8.5)
  .to("#s3", {opacity:0, scale:1.06, duration:0.4, ease:"power2.in"}, 9.95);

// ── 장면 4: 타이틀 ───────────────────────────
tl.fromTo("#s4-frame", {opacity:0, scale:1.04}, {opacity:1, scale:1, duration:0.9, ease:"power3.out"}, 10.15)
  .fromTo(".corner", {opacity:0}, {opacity:1, duration:0.5, stagger:0.08}, 10.4)
  .fromTo("#s4-mark", {opacity:0, y:"2vmin"}, {opacity:1, y:0, duration:0.6, ease:"power3.out"}, 10.3)
  .fromTo("#s4-title", {yPercent:110}, {yPercent:0, duration:0.8, ease:"power4.out"}, 10.5)
  .fromTo("#s4-bar", {scaleX:0}, {scaleX:1, duration:0.6, ease:"power3.out"}, 10.95)
  .fromTo("#s4-sub", {yPercent:110}, {yPercent:0, duration:0.6, ease:"power3.out"}, 11.1)
  .fromTo("#s4-tag", {yPercent:110}, {yPercent:0, duration:0.6, ease:"power3.out"}, 11.25)
  .fromTo("#s4 > :not(#s4-frame):not(.corner)", {scale:1}, {scale:1.03, duration:3.0, ease:"none"}, 10.9)
  .fromTo("#fade", {opacity:0}, {opacity:1, duration:0.8, ease:"power1.in"}, 13.2);

window.__timelines["main"] = tl;
tl.seek(0);
</script>
</body>
</html>
